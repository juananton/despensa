<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="500" height="500" fill="white"/>
<!-- El icono se declara maskable en el manifest, y de un icono adaptable
     Android NO enseña todo el lienzo: reserva el borde para el recorte y las
     animaciones del lanzador, y sólo garantiza el 80% central. La bolsa se
     queda por tanto dentro de ese círculo de radio 200, y el punto que marca
     el límite es la esquina inferior izquierda del trazo.

     Parece un paso atrás y es justo lo contrario: sin maskable, Android trata
     el icono como heredado, lo encoge un tercio y lo mete en un círculo blanco
     suyo, así que la bolsa acababa ocupando la mitad de lo que ocupa el resto
     de apps. Declarado maskable y a esta escala, llena el 82% del círculo.

     El translate de dentro la sube sobre el centro geométrico: el asa pesa
     menos que el cuerpo, así que centrada por sus límites se ve caída. Va
     dentro del scale a propósito, para que la compensación siga siendo
     proporcional si algún día se cambia el tamaño. -->
