<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- El mismo icono en PNG, y no por gusto: Chrome no usa un SVG para el
		     icono de las notificaciones, y además cachea los favicons por URL,
		     así que apuntar a un fichero nuevo es lo que le obliga a soltar el
		     que tenía guardado de antes. -->
		<link rel="icon" type="image/png" sizes="410x410" href="/icono.png" />
		<!-- El manifest está aquí por el icono de las notificaciones, no por
		     instalar la app: el círculo que Chrome pone a la izquierda del aviso
		     lo saca de aquí, y del favicon no puede porque es un SVG. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Despensa</title>
	</head>
	<body>
		<div id="root"></div>
		<div id="modal"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
